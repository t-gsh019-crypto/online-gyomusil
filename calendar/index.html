<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사 일정 캘린더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Crect x='14' y='18' width='36' height='32' rx='5' fill='%23fff'/%3E%3Crect x='14' y='18' width='36' height='9' fill='%23bdeed4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/common.css">
<style>
  :root { --accent: #10b981; --accent-2: #0ea5e9; }
  .nav { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; }
  .nav h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 20px; cursor: pointer; display: grid; place-items: center; transition: .2s var(--ease); }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 700; padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: .2s var(--ease); }
  .seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .legend button { display: inline-flex; align-items: center; gap: 6px; }
  .legend button.off { opacity: .35; text-decoration: line-through; }
  .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  .month { padding: 10px; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: 12px; font-weight: 700; padding: 4px 0 8px; color: var(--text-2); }
  .dow.sun, .num.sun { color: var(--danger); }
  .dow.sat, .num.sat { color: #3b82f6; }
  .day { min-height: 92px; padding: 6px 4px; border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; transition: background .2s var(--ease); }
  .day:hover { background: var(--accent-soft); }
  .day.other { opacity: .35; }
  .num { font-size: 13px; font-weight: 700; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; margin: 0 auto 2px; }
  .day.today .num { background: var(--grad); color: #fff !important; box-shadow: 0 6px 14px -4px color-mix(in srgb, var(--accent) 70%, transparent); }
  .ev { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border-left: 3px solid var(--c); }
  @media (prefers-color-scheme: dark) { .ev { color: color-mix(in srgb, var(--c) 45%, #fff); background: color-mix(in srgb, var(--c) 32%, transparent); } }
  .more { font-size: 11px; color: var(--text-2); font-weight: 600; padding-left: 4px; }

  .week { display: grid; gap: 10px; }
  .wday { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; }
  .wday .d { text-align: center; padding-top: 6px; font-size: 12px; font-weight: 700; color: var(--text-2); }
  .wday .d b { display: grid; place-items: center; margin: 2px auto 0; width: 40px; height: 40px; border-radius: 14px; font-size: 18px; color: var(--text); background: var(--surface); border: 1px solid var(--border); }
  .wday.today .d b { background: var(--grad); color: #fff; border: 0; box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
  .items { display: grid; gap: 8px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .item .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
  .item .t { font-weight: 700; letter-spacing: -0.02em; }
  .item .s { font-size: 13px; color: var(--text-2); }
  .add-day { border: 1.5px dashed var(--border); background: transparent; color: var(--text-2); border-radius: 14px; padding: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s var(--ease); }
  .add-day:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .day { min-height: 70px; padding: 4px 1px; border-radius: 10px; } .ev { font-size: 10px; padding: 1px 3px; border-left-width: 2px; } .month { padding: 6px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <svg class="app-icon" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#ig)"/>
      <rect x="13" y="17" width="38" height="34" rx="6" fill="#fff"/>
      <rect x="13" y="17" width="38" height="10" rx="6" fill="#bdeed4"/>
      <rect x="13" y="22" width="38" height="5" fill="#bdeed4"/>
      <rect x="21" y="12" width="4" height="10" rx="2" fill="#fff"/>
      <rect x="39" y="12" width="4" height="10" rx="2" fill="#fff"/>
      <rect x="19" y="32" width="7" height="6" rx="1.5" fill="#10b981"/>
      <rect x="29" y="32" width="7" height="6" rx="1.5" fill="#cfe9dc"/>
      <rect x="39" y="32" width="7" height="6" rx="1.5" fill="#cfe9dc"/>
      <rect x="19" y="41" width="7" height="6" rx="1.5" fill="#cfe9dc"/>
      <rect x="29" y="41" width="7" height="6" rx="1.5" fill="#f2a33a"/>
    </svg>
    <h1>학사 일정</h1>
    <button class="me-chip" id="meChip" type="button">내 정보</button>
    <a class="home-link" href="../">← 메인</a>
  </div>
</header>

<main class="wrap">
  <div class="banner hidden" id="modeBanner">⚠️ 체험 모드예요. 지금은 이 기기에만 저장돼요.</div>
  <section class="hero">
    <span class="eyebrow">📅 SCHOOL CALENDAR</span>
    <h2>한눈에 보는 <span class="grad">학사 일정</span></h2>
    <p>부서별 색으로 구분하고, 구글 캘린더로도 내보낼 수 있어요.</p>
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span>오늘 일정</span></div>
      <div class="stat"><b id="sWeek">0</b><span>이번 주 일정</span></div>
      <div class="stat"><b id="sMonth">0</b><span>이번 달 일정</span></div>
    </div>
  </section>
  <div class="nav">
    <h3 id="title"></h3>
    <button class="icon-btn" id="prev" type="button" aria-label="이전">‹</button>
    <button class="icon-btn" id="next" type="button" aria-label="다음">›</button>
  </div>
  <div class="controls">
    <div class="seg"><button id="vMonth" type="button">월간</button><button id="vWeek" type="button">주간</button></div>
    <button class="btn small ghost" id="goToday" type="button">오늘</button>
    <span class="grow"></span>
    <button class="btn small ghost" id="exportIcs" type="button" title="구글 캘린더의 '가져오기'로 불러올 수 있어요">⤓ 구글 캘린더로</button>
  </div>
  <div class="pills legend" id="legend"></div>
  <section id="view"></section>
</main>

<button class="btn fab" id="addBtn" type="button">＋ 일정 추가</button>

<dialog id="meDialog">
  <form method="dialog" id="meForm">
    <h2>선생님 정보</h2>
    <p class="muted">누가 일정을 올렸는지 표시하는 데 써요.</p>
    <label for="meName">이름</label>
    <input id="meName" required maxlength="20" placeholder="예: 김민지">
    <label for="meGroup">소속</label>
    <select id="meGroup"></select>
    <div class="actions"><button class="btn" value="ok">저장</button></div>
  </form>
</dialog>

<dialog id="evDialog">
  <form method="dialog" id="evForm">
    <h2 id="evHead">일정 추가</h2>
    <label for="eTitle">제목</label>
    <input id="eTitle" required maxlength="60" placeholder="예: 2학기 중간고사">
    <label for="eCat">구분</label>
    <select id="eCat"></select>
    <div class="two">
      <div><label for="eStart">시작일</label><input id="eStart" type="date" required></div>
      <div><label for="eEnd">종료일</label><input id="eEnd" type="date" required></div>
    </div>
    <label class="check"><input type="checkbox" id="eAllDay" checked> 하루 종일</label>
    <div class="two" id="timeRow">
      <div><label for="eFrom">시작 시각</label><input id="eFrom" type="time"></div>
      <div><label for="eTo">끝 시각</label><input id="eTo" type="time"></div>
    </div>
    <label for="ePlace">장소 (선택)</label>
    <input id="ePlace" maxlength="40">
    <label for="eMemo">메모 (선택)</label>
    <textarea id="eMemo" style="min-height:70px"></textarea>
    <p class="muted" id="eBy"></p>
    <div class="actions">
      <button class="btn danger hidden" id="eDelete" type="button">삭제</button>
      <button class="btn ghost" value="cancel" formnovalidate>취소</button>
      <button class="btn" value="ok">저장</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/school.js"></script>
<script>
const GROUPS = SCHOOL.depts.map((d) => d.name);
const CATS = [{ name: "학교 전체", color: "#475569" }, ...SCHOOL.depts, { name: "기타", color: "#8a93a6" }];
const colorOf = (c) => (CATS.find((x) => x.name === c) || CATS[CATS.length - 1]).color;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const DOW = ["일", "월", "화", "수", "목", "금", "토"];

let events = [], me = Me.get(), view = "month", cursor = new Date(), hidden = new Set(), editing = null;
try { hidden = new Set(JSON.parse(localStorage.getItem("gyomusil:cal-hidden") || "[]")); } catch {}

if (Store.mode === "local") $("modeBanner").classList.remove("hidden");
$("meGroup").innerHTML = GROUPS.map((g) => `<option>${g}</option>`).join("");
$("eCat").innerHTML = CATS.map((c) => `<option>${c.name}</option>`).join("");

function askMe() { $("meName").value = me?.name || ""; $("meGroup").value = GROUPS.includes(me?.group) ? me.group : GROUPS[0]; $("meDialog").showModal(); }
$("meForm").addEventListener("submit", () => { me = { name: $("meName").value.trim(), group: $("meGroup").value }; Me.set(me); paintMe(); });
$("meChip").onclick = askMe;
function paintMe() { $("meChip").textContent = me ? `👤 ${me.name}` : "내 정보"; $("meChip").title = me ? `${me.name} · ${me.group} (눌러서 바꾸기)` : ""; }

function paintLegend() {
  $("legend").innerHTML = CATS.map((c) => `<button type="button" data-c="${c.name}" class="${hidden.has(c.name) ? "off" : ""}"><span class="sw" style="background:${c.color}"></span>${c.name}</button>`).join("");
}
$("legend").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  hidden.has(b.dataset.c) ? hidden.delete(b.dataset.c) : hidden.add(b.dataset.c);
  try { localStorage.setItem("gyomusil:cal-hidden", JSON.stringify([...hidden])); } catch {}
  paintLegend(); render();
};

const visible = () => events.filter((e) => !hidden.has(e.category));
const onDay = (key) => visible()
  .filter((e) => e.start_date <= key && key <= e.end_date)
  .sort((a, b) => (a.all_day === b.all_day ? (a.start_time || "").localeCompare(b.start_time || "") : a.all_day ? -1 : 1));
const timeText = (e) => (e.all_day ? "하루 종일" : `${e.start_time || ""}${e.end_time ? "–" + e.end_time : ""}`);

async function load() {
  try { events = await Store.list("events"); }
  catch (err) { $("view").innerHTML = `<div class="card">불러오지 못했어요: ${esc(err.message)}</div>`; return; }
  render();
}

function render() {
  $("vMonth").classList.toggle("on", view === "month");
  $("vWeek").classList.toggle("on", view === "week");
  const t = new Date(), tk = ymd(t), ws = addDays(t, -t.getDay());
  const inRange = (a, b) => visible().filter((e) => e.start_date <= b && e.end_date >= a).length;
  $("sToday").textContent = inRange(tk, tk);
  $("sWeek").textContent = inRange(ymd(ws), ymd(addDays(ws, 6)));
  $("sMonth").textContent = inRange(ymd(new Date(t.getFullYear(), t.getMonth(), 1)), ymd(new Date(t.getFullYear(), t.getMonth() + 1, 0)));
  view === "month" ? renderMonth() : renderWeek();
}

function renderMonth() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $("title").textContent = `${y}년 ${m + 1}월`;
  const first = new Date(y, m, 1);
  const start = addDays(first, -first.getDay());
  const today = ymd(new Date());
  let html = DOW.map((d, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), key = ymd(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const list = onDay(key);
    const cls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
    html += `<div class="day ${d.getMonth() !== m ? "other" : ""} ${key === today ? "today" : ""}" data-date="${key}">
      <div class="num ${cls}">${d.getDate()}</div>
      ${list.slice(0, 3).map((e) => `<div class="ev" style="--c:${colorOf(e.category)}" data-id="${e.id}">${esc(e.title)}</div>`).join("")}
      ${list.length > 3 ? `<div class="more">+${list.length - 3}개 더</div>` : ""}
    </div>`;
  }
  $("view").innerHTML = `<div class="card month rise"><div class="grid">${html}</div></div>`;
}

function renderWeek() {
  const s = addDays(cursor, -cursor.getDay());
  const e = addDays(s, 6);
  $("title").textContent = `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`;
  const today = ymd(new Date());
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(s, i), key = ymd(d);
    const items = onDay(key).map((ev) => `<div class="card lift item" data-id="${ev.id}">
        <span class="bar" style="background:${colorOf(ev.category)}"></span>
        <div><div class="t">${esc(ev.title)}</div><div class="s">${timeText(ev)} · ${esc(ev.category)}${ev.place ? " · " + esc(ev.place) : ""}</div></div>
      </div>`).join("");
    html += `<div class="wday ${key === today ? "today" : ""}">
      <div class="d muted">${DOW[d.getDay()]}<b>${d.getDate()}</b></div>
      <div class="items">${items}<button class="add-day" type="button" data-date="${key}">＋ 이 날 일정 추가</button></div>
    </div>`;
  }
  $("view").innerHTML = `<div class="week">${html}</div>`;
}

$("view").onclick = (e) => {
  const ev = e.target.closest("[data-id]");
  if (ev) return openEdit(events.find((x) => x.id === ev.dataset.id));
  const day = e.target.closest("[data-date]");
  if (!day) return;
  if (view === "month" && !e.target.closest(".add-day")) { cursor = parse(day.dataset.date); view = "week"; return render(); }
  openNew(day.dataset.date);
};
$("prev").onclick = () => { cursor = view === "month" ? new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1) : addDays(cursor, -7); render(); };
$("next").onclick = () => { cursor = view === "month" ? new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1) : addDays(cursor, 7); render(); };
$("vMonth").onclick = () => { view = "month"; render(); };
$("vWeek").onclick = () => { view = "week"; render(); };
$("goToday").onclick = () => { cursor = new Date(); render(); };

function syncTime() { $("timeRow").classList.toggle("hidden", $("eAllDay").checked); }
$("eAllDay").onchange = syncTime;
$("eStart").onchange = () => { if ($("eEnd").value < $("eStart").value) $("eEnd").value = $("eStart").value; };

function openNew(date) {
  if (!me) return askMe();
  editing = null;
  $("evForm").reset();
  $("evHead").textContent = "일정 추가";
  $("eStart").value = $("eEnd").value = date || ymd(new Date());
  $("eCat").value = CATS.some((c) => c.name === me.group) ? me.group : "학교 전체";
  $("eBy").textContent = "";
  $("eDelete").classList.add("hidden");
  syncTime();
  $("evDialog").showModal();
}
function openEdit(ev) {
  if (!ev) return;
  editing = ev;
  $("evHead").textContent = "일정 보기·수정";
  $("eTitle").value = ev.title; $("eCat").value = ev.category;
  $("eStart").value = ev.start_date; $("eEnd").value = ev.end_date;
  $("eAllDay").checked = ev.all_day; $("eFrom").value = ev.start_time || ""; $("eTo").value = ev.end_time || "";
  $("ePlace").value = ev.place || ""; $("eMemo").value = ev.memo || "";
  $("eBy").textContent = `올린 사람: ${ev.author}`;
  $("eDelete").classList.remove("hidden");
  syncTime();
  $("evDialog").showModal();
}
$("addBtn").onclick = () => openNew(view === "week" ? ymd(cursor) : null);

$("evForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  if (!me) return askMe();
  const allDay = $("eAllDay").checked;
  const row = {
    title: $("eTitle").value.trim(), category: $("eCat").value,
    start_date: $("eStart").value, end_date: $("eEnd").value < $("eStart").value ? $("eStart").value : $("eEnd").value,
    all_day: allDay, start_time: allDay ? null : $("eFrom").value || null, end_time: allDay ? null : $("eTo").value || null,
    place: $("ePlace").value.trim() || null, memo: $("eMemo").value.trim() || null,
  };
  if (editing) await Store.update("events", editing.id, row);
  else await Store.insert("events", { ...row, author: me.name });
  load();
});
$("eDelete").onclick = async () => {
  const id = editing.id;
  $("evDialog").close();
  await Store.remove("events", id);
  load();
};

// 구글 캘린더 등에서 "가져오기"로 불러올 수 있는 .ics 파일 만들기
$("exportIcs").onclick = () => {
  const icsEsc = (s) => String(s || "").replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const d8 = (s) => s.replace(/-/g, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//online-gyomusil//KO", "CALSCALE:GREGORIAN"];
  for (const e of visible()) {
    lines.push("BEGIN:VEVENT", `UID:${e.id}@online-gyomusil`, `SUMMARY:${icsEsc(`[${e.category}] ${e.title}`)}`);
    if (e.all_day || !e.start_time) {
      lines.push(`DTSTART;VALUE=DATE:${d8(e.start_date)}`, `DTEND;VALUE=DATE:${d8(ymd(addDays(parse(e.end_date), 1)))}`);
    } else {
      lines.push(`DTSTART;TZID=Asia/Seoul:${d8(e.start_date)}T${e.start_time.replace(":", "")}00`,
        `DTEND;TZID=Asia/Seoul:${d8(e.end_date)}T${(e.end_time || e.start_time).replace(":", "")}00`);
    }
    if (e.place) lines.push(`LOCATION:${icsEsc(e.place)}`);
    if (e.memo) lines.push(`DESCRIPTION:${icsEsc(e.memo)}`);
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
  a.download = "학사일정.ics";
  a.click();
};

Store.subscribe("events", load);
paintMe(); paintLegend(); render(); load();
if (!me || !GROUPS.includes(me.group)) askMe();
</script>
</body>
</html>
