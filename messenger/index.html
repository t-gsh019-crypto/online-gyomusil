<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 메신저</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  :root { --accent: #0ea5e9; --accent-2: #6366f1; }
  .wrap.chat-wrap { padding-bottom: 0; }
  .shell { display: grid; grid-template-columns: 300px 1fr; gap: 14px; height: calc(100dvh - 140px); min-height: 460px; margin-top: 14px; }
  .pane { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  .pane-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .pane-head h3 { margin: 0; font-size: 17px; flex: 1; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rooms { overflow-y: auto; flex: 1; padding: 6px; }
  .room { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; cursor: pointer; transition: .15s; }
  .room:hover { background: var(--surface-2); }
  .room.on { background: var(--accent-soft); }
  .room .info { flex: 1; min-width: 0; }
  .room .name { font-weight: 700; display: flex; gap: 6px; align-items: center; }
  .room .name small { color: var(--text-2); font-weight: 600; }
  .room .last { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room .side { display: grid; justify-items: end; gap: 4px; font-size: 11px; color: var(--text-2); }
  .unread { background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 1px 7px; }
  .gav { width: 40px; height: 40px; border-radius: 14px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; background: var(--grad); }
  .gav.group { background: linear-gradient(135deg, #f59e0b, #ec4899); }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .day-sep { align-self: center; font-size: 12px; color: var(--text-2); background: var(--surface-2); padding: 3px 12px; border-radius: 999px; margin: 8px 0; }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 82%; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .who { font-size: 12px; color: var(--text-2); margin: 0 0 3px 4px; font-weight: 600; }
  .bubble { padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: var(--surface-solid); border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.5; }
  .msg.me .bubble { background: var(--grad); color: #fff; border: 0; border-radius: 18px 18px 6px 18px; }
  .msg .t { font-size: 11px; color: var(--text-2); white-space: nowrap; display: grid; justify-items: end; gap: 2px; }
  .msg.me .t { justify-items: start; }
  .bubble.deleted { opacity: .55; font-style: italic; }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(0, 0, 0, .06); color: inherit; text-decoration: none; font-weight: 700; margin-top: 4px; }
  .msg.me .file-chip { background: rgba(255, 255, 255, .2); }
  .bubble img { max-width: 220px; border-radius: 12px; display: block; margin-top: 4px; }
  .del { border: 0; background: transparent; color: var(--text-2); font-size: 11px; cursor: pointer; padding: 0; opacity: 0; }
  .msg:hover .del { opacity: 1; }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 12px; border-top: 1px solid var(--border); }
  .composer textarea { min-height: 44px; height: 44px; max-height: 140px; resize: none; flex: 1; border-radius: 22px; padding: 11px 16px; }
  .composer .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; cursor: pointer; flex: none; display: grid; place-items: center; }
  .composer .send { background: var(--grad); color: #fff; }
  .back { display: none; border: 0; background: var(--surface-2); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 18px; color: var(--text); }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow: auto; padding: 4px 0; }
  .pick label { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text); font-size: 14px; cursor: pointer; }
  .pick label:has(input:checked) { background: var(--accent); color: #fff; }
  .pick input { display: none; }
  .notice-line { font-size: 12px; color: var(--text-2); text-align: center; padding: 8px; }
  @media (max-width: 720px) {
    .hero { display: none; }
    .shell { grid-template-columns: 1fr; height: calc(100dvh - 90px); }
    .shell.chatting .list-pane { display: none; }
    .shell:not(.chatting) .chat-pane { display: none; }
    .back { display: grid; place-items: center; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <span data-app-icon="messenger"></span><h1>교사 메신저</h1>
  <button class="me-chip" id="meChip" type="button">내 정보</button><a class="home-link" href="../">← 메인</a>
</div></header>

<main class="wrap chat-wrap">
  <div class="banner hidden" id="modeBanner">⚠️ 체험 모드예요. 지금은 이 기기에만 저장돼요.</div>
  <section class="hero" style="padding-bottom:0">
    <span class="eyebrow">💬 MESSENGER</span>
    <h2>업무 대화는 <span class="grad">교사 메신저</span>로</h2>
    <p>1:1·그룹 대화와 파일 전송을 학교 업무용으로만 써요.</p>
  </section>
  <div class="shell" id="shell">
    <section class="card pane list-pane">
      <div class="pane-head"><h3>대화</h3><button class="btn small" id="newBtn" type="button">＋ 새 대화</button></div>
      <div style="padding:10px 10px 0"><input id="q" type="search" placeholder="이름·대화방 검색" aria-label="검색"></div>
      <div class="rooms" id="rooms"></div>
    </section>
    <section class="card pane chat-pane">
      <div class="pane-head"><button class="back" id="back" type="button" aria-label="목록으로">‹</button><h3 id="chatTitle">대화를 골라 주세요</h3><button class="btn small ghost hidden" id="leave" type="button">나가기</button></div>
      <div class="msgs" id="msgs"></div>
      <form class="composer hidden" id="composer">
        <label class="icon-btn" title="파일 보내기" style="margin:0">📎<input type="file" id="file" hidden></label>
        <textarea id="text" placeholder="메시지 입력 (Enter 보내기, Shift+Enter 줄바꿈)" aria-label="메시지"></textarea>
        <button class="icon-btn send" type="submit" aria-label="보내기">➤</button>
      </form>
    </section>
  </div>
</main>

<dialog id="newDialog"><form method="dialog" id="newForm">
  <h2>새 대화</h2>
  <p class="muted" style="margin:0">한 명을 고르면 1:1, 여러 명이면 그룹 대화가 돼요.</p>
  <input id="pq" type="search" placeholder="이름·부서로 찾기" style="margin-top:12px">
  <div class="pick" id="pick" style="margin-top:8px"></div>
  <div id="gnameBox" class="hidden"><label for="gname">그룹 이름</label><input id="gname" maxlength="30" placeholder="예: 2학년부 담임"></div>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>취소</button><button class="btn" value="ok">대화 시작</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/school.js"></script>
<script src="../shared/apps.js"></script>
<script src="../shared/app.js"></script>
<script>
const { $, esc, ymd, DOW } = U;
let rooms = [], msgs = [], cur = null;
const pad = U.pad;
const readKey = "gyomusil:chat-read";
let lastRead = {}; try { lastRead = JSON.parse(localStorage.getItem(readKey) || "{}"); } catch {}
const markRead = (id) => { lastRead[id] = new Date().toISOString(); try { localStorage.setItem(readKey, JSON.stringify(lastRead)); } catch {} };

App.init({ onMe: render });
window.addEventListener("roster", paintPick);

const myRooms = () => rooms.filter((r) => App.me && (r.members || []).includes(App.me.name));
const roomName = (r) => r.is_group ? r.name : (r.members || []).filter((m) => m !== App.me?.name)[0] || "나";
const msgsOf = (id) => msgs.filter((m) => m.room_id === id).sort((a, b) => a.created_at.localeCompare(b.created_at));
const lastOf = (id) => { const l = msgsOf(id); return l[l.length - 1]; };
const unreadOf = (r) => msgsOf(r.id).filter((m) => m.author !== App.me?.name && m.created_at > (lastRead[r.id] || "")).length;
const timeTxt = (iso) => { const d = new Date(iso); return ymd(d) === ymd(new Date()) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${d.getMonth() + 1}/${d.getDate()}`; };

async function load() {
  try { [rooms, msgs] = await Promise.all([Store.list("chat_rooms"), Store.list("chat_messages")]); }
  catch (e) { $("rooms").innerHTML = `<p class="muted" style="padding:10px">불러오지 못했어요: ${esc(e.message)}</p>`; return; }
  rooms.forEach((r) => { if (typeof r.members === "string") r.members = JSON.parse(r.members); });
  render();
}

function render() {
  const q = $("q").value.trim();
  const list = myRooms()
    .filter((r) => !q || roomName(r).includes(q) || (r.members || []).some((m) => m.includes(q)))
    .sort((a, b) => (lastOf(b.id)?.created_at || b.created_at).localeCompare(lastOf(a.id)?.created_at || a.created_at));
  $("rooms").innerHTML = list.map((r) => {
    const l = lastOf(r.id), u = unreadOf(r), name = roomName(r);
    return `<div class="room ${cur === r.id ? "on" : ""}" data-id="${r.id}">
      <span class="gav ${r.is_group ? "group" : ""}">${r.is_group ? "👥" : esc(name.slice(-2))}</span>
      <div class="info"><div class="name">${esc(name)}${r.is_group ? `<small>${r.members.length}</small>` : ""}</div>
        <div class="last">${l ? (l.file_name && !l.body ? "📎 " + esc(l.file_name) : esc(l.deleted ? "삭제된 메시지" : l.body)) : "대화를 시작해 보세요"}</div></div>
      <div class="side">${l ? timeTxt(l.created_at) : ""}${u && cur !== r.id ? `<span class="unread">${u}</span>` : ""}</div></div>`;
  }).join("") || `<div class="notice-line" style="padding:30px 10px">아직 대화가 없어요.<br>[＋ 새 대화]로 시작해 보세요.</div>`;
  renderChat();
}

function renderChat() {
  const r = rooms.find((x) => x.id === cur);
  $("shell").classList.toggle("chatting", !!r);
  $("composer").classList.toggle("hidden", !r);
  $("leave").classList.toggle("hidden", !r || !r.is_group);
  if (!r) { $("chatTitle").textContent = "대화를 골라 주세요"; $("msgs").innerHTML = App.empty("대화를 골라 주세요", "왼쪽 목록에서 대화방을 누르면 여기에 열려요.", "💬"); return; }
  $("chatTitle").textContent = r.is_group ? `${r.name} (${r.members.length})` : roomName(r);
  const box = $("msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let lastDay = "", lastAuthor = "";
  box.innerHTML = `<div class="notice-line">🔒 학교 업무용 대화방이에요. 학생 개인정보는 보내지 말아 주세요.${r.is_group ? `<br>참여: ${r.members.map(esc).join(", ")}` : ""}</div>` + msgsOf(r.id).map((m) => {
    const d = new Date(m.created_at), day = ymd(d), me = m.author === App.me?.name;
    let sep = "";
    if (day !== lastDay) { sep = `<div class="day-sep">${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</div>`; lastDay = day; lastAuthor = ""; }
    const showWho = !me && m.author !== lastAuthor; lastAuthor = m.author;
    const isImg = m.file_url && /\.(png|jpe?g|gif|webp)$/i.test(m.file_name || "");
    const file = m.file_url && !m.deleted ? (isImg ? `<a href="${esc(m.file_url)}" target="_blank" rel="noopener"><img src="${esc(m.file_url)}" alt="${esc(m.file_name)}"></a>` : `<a class="file-chip" href="${esc(m.file_url)}" download="${esc(m.file_name || "")}">📎 ${esc(m.file_name || "파일")}</a>`) : "";
    return `${sep}<div class="msg ${me ? "me" : ""}">${!me ? (showWho ? App.avatar(m.author, 32) : '<span style="width:32px;flex:none"></span>') : ""}
      <div>${showWho ? `<div class="who">${esc(m.author)}</div>` : ""}<div class="bubble ${m.deleted ? "deleted" : ""}">${m.deleted ? "삭제된 메시지예요" : esc(m.body || "")}${file}</div></div>
      <div class="t">${me && !m.deleted ? `<button class="del" data-del="${m.id}" type="button">삭제</button>` : ""}<span>${pad(d.getHours())}:${pad(d.getMinutes())}</span></div></div>`;
  }).join("");
  if (atBottom || box.dataset.room !== cur) box.scrollTop = box.scrollHeight;
  box.dataset.room = cur;
  markRead(cur);
}

$("rooms").onclick = (e) => { const r = e.target.closest(".room"); if (r) { cur = r.dataset.id; render(); setTimeout(() => $("text").focus(), 50); } };
$("back").onclick = () => { cur = null; render(); };
$("q").oninput = render;

/* 보내기 */
async function send(body, file) {
  if (!App.need() || !cur) return;
  let file_url = null, file_name = null;
  if (file) {
    try { App.toast("파일 올리는 중…"); file_url = await Store.upload(file, "chat"); file_name = file.name; }
    catch (e) { App.toast("파일을 보내지 못했어요: " + e.message); return; }
  }
  await Store.insert("chat_messages", { room_id: cur, author: App.me.name, body: body || null, file_url, file_name, deleted: false });
  load();
}
$("composer").addEventListener("submit", (e) => { e.preventDefault(); const v = $("text").value.trim(); if (!v) return; $("text").value = ""; $("text").style.height = ""; send(v); });
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
$("text").addEventListener("input", () => { $("text").style.height = "auto"; $("text").style.height = Math.min(140, $("text").scrollHeight) + "px"; });
$("file").onchange = () => { const f = $("file").files[0]; if (f) send("", f); $("file").value = ""; };
$("msgs").onclick = async (e) => { const b = e.target.closest("[data-del]"); if (b && (await App.confirm("이 메시지를 삭제할까요?", "삭제"))) { await Store.update("chat_messages", b.dataset.del, { deleted: true }); load(); } };
$("leave").onclick = async () => {
  const r = rooms.find((x) => x.id === cur);
  if (!(await App.confirm(`"${r.name}" 대화방에서 나갈까요?`, "나가기"))) return;
  await Store.update("chat_rooms", r.id, { members: r.members.filter((m) => m !== App.me.name) });
  await Store.insert("chat_messages", { room_id: r.id, author: App.me.name, body: `${App.me.name} 선생님이 나갔어요.`, deleted: false });
  cur = null; load();
};

/* 새 대화 */
function paintPick() {
  const q = $("pq").value.trim();
  const checked = new Set([...$("pick").querySelectorAll("input:checked")].map((x) => x.value));
  $("pick").innerHTML = App.roster.filter((t) => t.name !== App.me?.name).filter((t) => !q || t.name.includes(q) || (t.group || "").includes(q))
    .map((t) => `<label><input type="checkbox" value="${esc(t.name)}" ${checked.has(t.name) ? "checked" : ""}>${esc(t.name)} <span style="opacity:.6;font-size:11px">${esc(t.group || "")}</span></label>`).join("")
    || '<span class="muted">다른 선생님이 아직 없어요. 선생님들이 앱을 한 번 열면 명단에 생겨요.</span>';
}
$("pq").oninput = paintPick;
$("pick").addEventListener("change", () => $("gnameBox").classList.toggle("hidden", $("pick").querySelectorAll("input:checked").length < 2));
$("newBtn").onclick = () => { if (!App.need()) return; $("newForm").reset(); $("gnameBox").classList.add("hidden"); paintPick(); $("newDialog").showModal(); };
$("newForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  const picked = [...$("pick").querySelectorAll("input:checked")].map((x) => x.value);
  if (!picked.length) return e.preventDefault();
  if (picked.length === 1) {
    const ex = myRooms().find((r) => !r.is_group && r.members.includes(picked[0]));
    if (ex) { cur = ex.id; return render(); }
    cur = (await Store.insert("chat_rooms", { is_group: false, name: null, members: [App.me.name, picked[0]], created_by: App.me.name })).id;
  } else {
    cur = (await Store.insert("chat_rooms", { is_group: true, name: $("gname").value.trim() || picked.slice(0, 3).join(", "), members: [App.me.name, ...picked], created_by: App.me.name })).id;
  }
  load();
});

Store.subscribe("chat_rooms", load);
Store.subscribe("chat_messages", load);
render(); load();
</script>
</body>
</html>
