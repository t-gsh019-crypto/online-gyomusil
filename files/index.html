<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료실</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  :root { --accent: #f97316; --accent-2: #f59e0b; }
  .toolbar { display: flex; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .toolbar .search { flex: 1; min-width: 180px; position: relative; margin: 0; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-2); }
  .search input { padding-left: 42px; }
  .toolbar select { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 6px; }
  .file { cursor: pointer; display: grid; gap: 10px; align-content: start; }
  .file .head { display: flex; gap: 12px; align-items: center; }
  .ft { width: 46px; height: 54px; flex: none; }
  .file h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .file .sub { font-size: 12px; color: var(--text-2); }
  .file .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .star { margin-left: auto; border: 0; background: transparent; font-size: 18px; cursor: pointer; opacity: .35; padding: 0; }
  .star.on { opacity: 1; }
  .ver { font-size: 11px; font-weight: 800; color: #fff; background: var(--grad); padding: 2px 7px; border-radius: 999px; }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); gap: 2px; margin-top: 4px; }
  .seg button { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); }
  .svc { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); font-size: 13px; }
  .svc .ft { width: 30px; height: 36px; }
  .svc b { display: block; font-size: 14px; }
  .svc.warn { background: color-mix(in srgb, #f59e0b 14%, transparent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hist { display: grid; gap: 6px; margin-top: 8px; }
  .hist div { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
  .hist a { margin-left: auto; color: var(--accent); font-weight: 700; text-decoration: none; }
  .detail-desc { white-space: pre-wrap; margin: 10px 0; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <span data-app-icon="files"></span><h1>자료실</h1>
  <button class="me-chip" id="meChip" type="button">내 정보</button><a class="home-link" href="../">← 메인</a>
</div></header>

<main class="wrap">
  <div class="banner hidden" id="modeBanner">⚠️ 체험 모드예요. 지금은 이 기기에만 저장돼요.</div>
  <section class="hero">
    <span class="eyebrow">📁 SHARED LINKS</span>
    <h2>함께 쓰는 <span class="grad">자료실</span></h2>
    <p>파일은 구글 드라이브·원드라이브 등에 두고, 여기에는 링크만 모아 교과·학년·업무별로 정리해요.</p>
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>전체 자료</span></div>
      <div class="stat"><b id="sWeek">0</b><span>이번 주 새 자료</span></div>
      <div class="stat"><b id="sForm">0</b><span>양식</span></div>
    </div>
  </section>
  <nav class="pills" id="folders"></nav>
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="제목·태그·설명 검색" aria-label="검색"></label>
    <select id="cat" aria-label="세부 분류"></select>
    <select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="name">이름순</option><option value="pop">많이 본 순</option></select>
  </div>
  <section class="grid" id="grid"></section>
</main>
<button class="btn fab" id="addBtn" type="button">＋ 자료 링크 추가</button>

<dialog id="upDialog"><form method="dialog" id="upForm">
  <h2 id="upHead">자료 링크 추가</h2>
  <div id="linkBox"><label for="link">자료 주소</label><input id="link" type="url" placeholder="https://drive.google.com/..." autocomplete="off"><div id="svcBox"></div></div>
  <label for="title">제목</label><input id="title" required maxlength="80">
  <div class="two">
    <div><label for="folder">폴더</label><select id="folder"></select></div>
    <div><label for="category">세부 분류</label><input id="category" list="catList" maxlength="20" placeholder="예: 국어, 1학년부"></div>
  </div>
  <datalist id="catList"></datalist>
  <label for="tags">태그 (쉼표로 구분)</label><input id="tags" placeholder="예: 공문, 계획서, 2학기">
  <label for="desc">설명 (선택)</label><textarea id="desc" style="min-height:70px"></textarea>
  <p class="hint" id="upMsg" style="color:var(--danger);font-size:13px"></p>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>취소</button><button class="btn" value="ok" id="upOk">올리기</button></div>
</form></dialog>

<dialog id="viewDialog">
  <div class="row" style="gap:12px;align-items:flex-start"><div id="vType"></div><div class="grow"><h2 id="vTitle" style="margin:0"></h2><div class="muted" id="vMeta"></div></div></div>
  <div class="row" id="vTags" style="margin-top:10px"></div>
  <div class="detail-desc" id="vDesc"></div>
  <div class="row"><a class="btn" id="vOpen" target="_blank" rel="noopener">⬇️ 받기·열기</a><button class="btn ghost" id="vNewVer" type="button">🔁 새 버전 링크</button></div>
  <h4 style="margin:18px 0 0">🕘 버전 기록</h4>
  <div class="hist" id="vHist"></div>
  <div class="actions"><button class="btn danger hidden" id="vDel" type="button">삭제</button><button class="btn ghost" id="vEdit" type="button">정보 수정</button><button class="btn" id="vClose" type="button">닫기</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/school.js"></script>
<script src="../shared/apps.js"></script>
<script src="../shared/app.js"></script>
<script>
const { $, esc, fmt, ymd, addDays } = U;
const FOLDERS = [["전체", "🗃"], ["교과", "📚"], ["학년", "🏫"], ["업무", "🗂"], ["양식", "📝"], ["기타", "📦"], ["즐겨찾기", "⭐"]];
const TYPES = { hwp: ["#2f6fed", "HWP"], hwpx: ["#2f6fed", "HWP"], pdf: ["#e5484d", "PDF"], xls: ["#12a150", "XLS"], xlsx: ["#12a150", "XLS"], csv: ["#12a150", "CSV"],
  ppt: ["#f97316", "PPT"], pptx: ["#f97316", "PPT"], doc: ["#3b82f6", "DOC"], docx: ["#3b82f6", "DOC"], png: ["#8b5cf6", "IMG"], jpg: ["#8b5cf6", "IMG"], jpeg: ["#8b5cf6", "IMG"],
  zip: ["#64748b", "ZIP"], mp4: ["#ec4899", "MP4"], txt: ["#64748b", "TXT"] };
// 링크 주소로 어느 서비스 자료인지 알아봄 [색, 아이콘 글자, 이름]
const SERVICES = [
  [/docs\.google\.com\/document/, "#4285f4", "DOCS", "구글 문서"], [/docs\.google\.com\/spreadsheets/, "#0f9d58", "SHEET", "구글 시트"],
  [/docs\.google\.com\/presentation/, "#f4b400", "SLIDE", "구글 슬라이드"], [/docs\.google\.com\/forms|forms\.gle/, "#7248b9", "FORM", "구글 설문지"],
  [/drive\.google\.com/, "#1a73e8", "DRIVE", "구글 드라이브"], [/onedrive|sharepoint\.com|1drv\.ms/, "#0078d4", "ONE", "원드라이브"],
  [/mybox\.naver\.com/, "#03c75a", "MYBOX", "네이버 MYBOX"], [/youtube\.com|youtu\.be/, "#ff0000", "YT", "유튜브"],
  [/padlet\./, "#e5266d", "PADLET", "패들렛"], [/canva\./, "#00c4cc", "CANVA", "캔바"], [/notion\.(so|site)/, "#111827", "NOTION", "노션"],
];
const service = (url) => { const m = SERVICES.find(([re]) => re.test(url || "")); if (m) return m.slice(1); try { return ["#64748b", "LINK", new URL(url).hostname.replace(/^www\./, "")]; } catch { return ["#64748b", "LINK", "링크"]; } };
const typeOf = (f) => f.kind === "link" ? service(f.url) : TYPES[(f.file_name || "").split(".").pop().toLowerCase()] || ["#94a3b8", "FILE"];
const typeIcon = (f, w = 46) => { const [c, t] = typeOf(f); return `<svg class="ft" viewBox="0 0 46 54" width="${w}" aria-hidden="true">
  <path d="M6 2h24l14 14v32a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="${c}" opacity=".14"/><path d="M30 2v10a4 4 0 0 0 4 4h10" fill="${c}" opacity=".35"/>
  <rect x="5" y="30" width="36" height="14" rx="4" fill="${c}"/><text x="23" y="40.5" text-anchor="middle" font-size="${t.length > 4 ? 7.5 : 9.5}" font-weight="800" fill="#fff" font-family="system-ui">${t}</text></svg>`; };

let files = [], folder = "전체", editing = null, verFor = null, openId = null;
let favs = new Set(); try { favs = new Set(JSON.parse(localStorage.getItem("gyomusil:fav-files") || "[]")); } catch {}
const saveFavs = () => { try { localStorage.setItem("gyomusil:fav-files", JSON.stringify([...favs])); } catch {} };

App.init({ onMe: render });
$("folders").innerHTML = FOLDERS.map(([f, e]) => `<button type="button" data-f="${f}">${e} ${f}</button>`).join("");
$("folder").innerHTML = FOLDERS.slice(1, 6).map(([f]) => `<option>${f}</option>`).join("");

async function load() {
  try { files = await Store.list("files"); } catch (e) { $("grid").innerHTML = `<p class="muted">불러오지 못했어요: ${esc(e.message)}</p>`; return; }
  files.forEach((f) => { if (typeof f.versions === "string") f.versions = JSON.parse(f.versions); });
  render();
  if (openId) paint(openId);
}

function render() {
  [...$("folders").children].forEach((b) => b.classList.toggle("on", b.dataset.f === folder));
  const weekAgo = addDays(new Date(), -7).toISOString();
  $("sAll").textContent = files.length;
  $("sWeek").textContent = files.filter((f) => f.created_at > weekAgo).length;
  $("sForm").textContent = files.filter((f) => f.folder === "양식").length;
  const inFolder = files.filter((f) => folder === "전체" || (folder === "즐겨찾기" ? favs.has(f.id) : f.folder === folder));
  const cats = [...new Set(inFolder.map((f) => f.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  const cur = $("cat").value;
  $("cat").innerHTML = `<option value="">세부 분류 전체</option>` + cats.map((c) => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
  $("catList").innerHTML = [...new Set(files.map((f) => f.category).filter(Boolean)), ...SCHOOL.depts.map((d) => d.name)].map((c) => `<option value="${esc(c)}">`).join("");
  const q = $("q").value.trim().toLowerCase(), cat = $("cat").value, sort = $("sort").value;
  const rows = inFolder
    .filter((f) => !cat || f.category === cat)
    .filter((f) => !q || [f.title, f.tags, f.description, f.category, f.file_name].join(" ").toLowerCase().includes(q))
    .sort(sort === "name" ? (a, b) => a.title.localeCompare(b.title, "ko") : sort === "pop" ? (a, b) => (b.downloads || 0) - (a.downloads || 0) : (a, b) => (b.updated_at || b.created_at).localeCompare(a.updated_at || a.created_at));
  $("grid").innerHTML = rows.map((f, i) => `<article class="card lift file rise" style="animation-delay:${Math.min(i, 10) * 30}ms" data-id="${f.id}">
      <div class="head">${typeIcon(f)}<div style="min-width:0"><h3>${esc(f.title)}</h3><div class="sub">${esc(f.folder)}${f.category ? " · " + esc(f.category) : ""}</div></div>
        <button class="star ${favs.has(f.id) ? "on" : ""}" data-star="${f.id}" type="button" aria-label="즐겨찾기">⭐</button></div>
      <div class="tags">${f.version > 1 ? `<span class="ver">v${f.version}</span>` : ""}${(f.tags || "").split(",").map((t) => t.trim()).filter(Boolean).map((t) => `<span class="chip">#${esc(t)}</span>`).join("")}</div>
      <div class="sub">${esc(typeOf(f)[2] || "파일")} · ${esc(f.author)} · ${fmt(f.updated_at || f.created_at)} · 👀 ${f.downloads || 0}</div>
    </article>`).join("") || App.empty(folder === "즐겨찾기" ? "즐겨찾기한 자료가 없어요" : "아직 자료가 없어요", folder === "즐겨찾기" ? "자료 카드의 ⭐를 눌러 보세요." : "오른쪽 아래 버튼으로 첫 자료를 올려 보세요.", "📂");
}

$("folders").onclick = (e) => { const b = e.target.closest("button"); if (b) { folder = b.dataset.f; $("cat").value = ""; render(); } };
["q", "cat", "sort"].forEach((id) => $(id).addEventListener(id === "q" ? "input" : "change", render));
$("grid").onclick = (e) => {
  const s = e.target.closest("[data-star]");
  if (s) { favs.has(s.dataset.star) ? favs.delete(s.dataset.star) : favs.add(s.dataset.star); saveFavs(); return render(); }
  const c = e.target.closest(".file"); if (c) openView(c.dataset.id);
};

/* 올리기 · 수정 · 새 버전 */
// 주소를 넣으면 어떤 서비스인지 보여 주고, 공유 설정을 안내
function paintSvc() {
  const url = $("link").value.trim();
  if (!/^https?:\/\/./.test(url)) { $("svcBox").innerHTML = ""; return; }
  const [c, t, name] = service(url), drive = /google\.com|onedrive|sharepoint|1drv\.ms|mybox/.test(url);
  $("svcBox").innerHTML = `<div class="svc ${drive ? "warn" : ""}">${typeIcon({ kind: "link", url }, 30)}<div><b>${esc(name)}</b>${drive ? "공유 설정을 <b style=\"display:inline\">링크가 있는 모든 사용자(보기)</b>로 바꿔야 다른 선생님도 열 수 있어요." : "이 주소로 연결돼요."}</div></div>`;
}
$("link").addEventListener("input", paintSvc);
function openUpload(mode, f) {
  if (!App.need()) return;
  editing = mode === "edit" ? f : null; verFor = mode === "version" ? f : null;
  $("upForm").reset(); $("upMsg").textContent = "";
  $("upHead").textContent = mode === "edit" ? "자료 정보 수정" : mode === "version" ? `새 버전 링크 (지금 v${f.version || 1})` : "자료 링크 추가";
  $("upOk").textContent = mode === "new" ? "추가" : "저장";
  $("linkBox").classList.toggle("hidden", mode === "edit");
  $("link").required = mode !== "edit";
  paintSvc();
  if (f) { $("title").value = f.title; $("folder").value = f.folder; $("category").value = f.category || ""; $("tags").value = f.tags || ""; $("desc").value = f.description || ""; }
  else if (folder !== "전체" && folder !== "즐겨찾기") $("folder").value = folder;
  $("upDialog").showModal();
}
$("addBtn").onclick = () => openUpload("new");
$("upForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  e.preventDefault();
  const meta = { title: $("title").value.trim(), folder: $("folder").value, category: $("category").value.trim() || null, tags: $("tags").value.trim() || null, description: $("desc").value.trim() || null };
  try {
    if (editing) { await Store.update("files", editing.id, meta); }
    else {
      const url = $("link").value.trim(), kind = "link", file_name = null, size = null;
      if (!/^https?:\/\//.test(url)) { $("upMsg").textContent = "https:// 로 시작하는 주소를 넣어 주세요."; return; }
      const now = new Date().toISOString();
      if (verFor) {
        const v = (verFor.version || 1) + 1;
        const versions = [...(verFor.versions || []), { version: v, url, file_name, at: now, by: App.me.name }];
        await Store.update("files", verFor.id, { ...meta, kind, url, file_name, size, version: v, versions, updated_at: now });
      } else {
        await Store.insert("files", { ...meta, kind, url, file_name, size, version: 1, versions: [{ version: 1, url, file_name, at: now, by: App.me.name }], downloads: 0, author: App.me.name });
      }
    }
    $("upDialog").close();
    App.toast("저장했어요");
    load();
  } catch (err) { $("upMsg").textContent = "저장하지 못했어요: " + err.message; }
});

/* 자세히 보기 */
function openView(id) { openId = id; paint(id); $("viewDialog").showModal(); }
function paint(id) {
  const f = files.find((x) => x.id === id); if (!f) return;
  $("vType").innerHTML = typeIcon(f, 52);
  $("vTitle").textContent = f.title;
  $("vMeta").textContent = `${typeOf(f)[2] || "파일"} · ${f.folder}${f.category ? " · " + f.category : ""} · ${f.author} · ${fmt(f.created_at)}${f.size ? ` · ${(f.size / 1024 / 1024).toFixed(1)}MB` : ""}`;
  $("vTags").innerHTML = `${f.version > 1 ? `<span class="ver">최신 v${f.version}</span>` : ""}` + (f.tags || "").split(",").map((t) => t.trim()).filter(Boolean).map((t) => `<span class="chip">#${esc(t)}</span>`).join("");
  $("vDesc").textContent = f.description || "";
  $("vOpen").href = f.url;
  if (f.kind === "file") $("vOpen").setAttribute("download", f.file_name || ""); else $("vOpen").removeAttribute("download");
  $("vOpen").textContent = f.kind === "link" ? "🔗 열기" : "⬇️ 받기";
  $("vHist").innerHTML = (f.versions || []).slice().reverse().map((v) => `<div><span class="ver">v${v.version}</span><span>${esc(v.by)} · ${fmt(v.at)}</span><a href="${esc(v.url)}" ${f.kind === "file" ? `download="${esc(v.file_name || "")}"` : 'target="_blank" rel="noopener"'}>${f.kind === "file" ? "받기" : "열기"}</a></div>`).join("");
  $("vDel").classList.toggle("hidden", !(App.me && f.author === App.me.name));
}
$("vOpen").onclick = () => { const f = files.find((x) => x.id === openId); if (f) Store.update("files", f.id, { downloads: (f.downloads || 0) + 1 }).then(load); };
$("vNewVer").onclick = () => openUpload("version", files.find((x) => x.id === openId));
$("vEdit").onclick = () => openUpload("edit", files.find((x) => x.id === openId));
$("vClose").onclick = () => $("viewDialog").close();
$("viewDialog").addEventListener("close", () => { openId = null; });
$("vDel").onclick = async () => {
  if (!(await App.confirm("이 자료를 삭제할까요? 되돌릴 수 없어요.", "삭제"))) return;
  const id = openId; $("viewDialog").close(); await Store.remove("files", id); load();
};

Store.subscribe("files", load);
render(); load();
</script>
</body>
</html>
