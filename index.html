<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6cf6">
<title>온라인 교무실</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  :root { --accent: #3b6cf6; --accent-2: #8b5cf6; }
  body {
    background:
      radial-gradient(70vw 55vh at 105% -10%, color-mix(in srgb, #8b5cf6 26%, transparent), transparent 70%),
      radial-gradient(60vw 50vh at -10% 0%, color-mix(in srgb, #10b981 18%, transparent), transparent 70%),
      radial-gradient(60vw 50vh at 50% 110%, color-mix(in srgb, #ec4899 14%, transparent), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1040px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 22px 0 6px; }
  .logo { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 6px 14px rgba(59, 108, 246, .35)); }
  .brand { font-weight: 800; font-size: 19px; letter-spacing: -0.03em; flex: 1; }
  .brand small { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: 0; }
  .clock { text-align: right; font-variant-numeric: tabular-nums; }
  .clock b { display: block; font-size: 22px; letter-spacing: -0.02em; line-height: 1.1; }
  .clock span { font-size: 12px; color: var(--text-2); }
  .hello { margin: 26px 0 18px; }
  .hello h2 { font-size: clamp(26px, 6vw, 40px); line-height: 1.2; margin: 0; letter-spacing: -0.04em; }
  .hello h2 .grad { background: linear-gradient(120deg, #3b6cf6, #8b5cf6 45%, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hello p { margin: 8px 0 0; color: var(--text-2); }
  .hello p button { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .search { position: relative; margin: 0 0 8px; }
  .search input { padding-left: 44px; height: 52px; border-radius: 18px; background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 16px; }
  .search svg { position: absolute; z-index: 1; pointer-events: none; left: 15px; top: 15px; width: 22px; height: 22px; color: var(--text-2); }
  .sec { margin-top: 26px; }
  .sec h3 { margin: 0 0 12px 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--text-2); text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--text); text-align: center; -webkit-tap-highlight-color: transparent; outline: none; }
  .tile .ic { width: 68px; height: 68px; border-radius: 20px; display: grid; place-items: center; transition: transform .35s var(--ease), box-shadow .35s var(--ease); box-shadow: 0 10px 22px -10px var(--c1), 0 2px 4px rgba(15, 23, 42, .08); position: relative; }
  .tile .ic svg { width: 100%; height: 100%; border-radius: 20px; display: block; }
  .tile .ic::after { content: ""; position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(160deg, rgba(255, 255, 255, .35), transparent 45%); pointer-events: none; }
  .tile b { font-size: 13px; font-weight: 700; line-height: 1.25; letter-spacing: -0.03em; word-break: keep-all; }
  .tile p { display: none; margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .tile:hover .ic, .tile:focus-visible .ic { transform: translateY(-4px) scale(1.04); box-shadow: 0 18px 30px -12px var(--c1), 0 2px 4px rgba(15, 23, 42, .08); }
  .tile:focus-visible .ic { outline: 3px solid var(--c1); outline-offset: 3px; }
  .tile:active .ic { transform: scale(.94); transition-duration: .1s; }
  .tile.pop { animation: pop .5s var(--ease) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  .recent { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .chipapp { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow); transition: transform .2s var(--ease); }
  .chipapp:hover { transform: translateY(-2px); }
  .chipapp svg { width: 30px; height: 30px; border-radius: 9px; }
  .none { text-align: center; color: var(--text-2); padding: 40px 0; }
  .userbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .userbar .who { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
  .userbar .who i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; background: linear-gradient(135deg, #3b6cf6, #8b5cf6); }
  .userbar .who small { color: var(--text-2); font-weight: 600; }
  .auth { max-width: 440px; margin: 10px auto 0; padding: 24px; }
  .auth h3 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.03em; }
  .auth .lead { margin: 0 0 6px; color: var(--text-2); font-size: 14px; }
  .auth .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: var(--surface-2); margin-bottom: 14px; }
  .auth .seg button { border: 0; background: transparent; font: inherit; font-weight: 700; padding: 9px; border-radius: 10px; color: var(--text-2); cursor: pointer; }
  .auth .seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); }
  .auth .btn.full { width: 100%; justify-content: center; margin-top: 16px; }
  .auth .msg { font-size: 13px; margin: 10px 0 0; line-height: 1.5; }
  .auth .msg.err { color: var(--danger); }
  .auth .msg.ok { color: var(--ok); }
  .auth .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
  .auth .rule { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 13px; line-height: 1.55; margin-top: 14px; }
  .auth .mail { text-align: center; }
  .auth .mail .big { font-size: 56px; line-height: 1; margin: 6px 0 10px; }
  .today { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 4px 0 22px; }
  @media (min-width: 820px) { .today { grid-template-columns: 1.15fr 1fr; align-items: start; } }
  .today .card { padding: 18px; }
  .td-head, .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .td-head h3, .cal-head h3 { margin: 0; font-size: 18px; letter-spacing: -0.03em; flex: 1; }
  .cal-head h3 { text-align: center; }
  .td-head .cnt { font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface-2); padding: 3px 10px; border-radius: 999px; }
  .pends { display: flex; gap: 6px; flex-wrap: wrap; }
  .pends:not(:empty) { margin-bottom: 10px; }
  .pend { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 13px; font-weight: 700; text-decoration: none; color: var(--text); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .pend svg { width: 22px; height: 22px; border-radius: 7px; }
  .pend.warn { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .tlist { display: grid; gap: 2px; }
  @media (min-width: 820px) { .tlist { max-height: 470px; overflow-y: auto; } }
  .ti { display: grid; grid-template-columns: 50px 14px 1fr auto; gap: 8px; align-items: center; padding: 9px 8px; border-radius: 14px; text-decoration: none; color: var(--text); transition: background .2s; position: relative; }
  .ti:hover { background: var(--surface-2); }
  .ti .tt { text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .ti .tt b { font-size: 14px; }
  .ti .tt small { display: block; font-size: 11px; color: var(--text-2); }
  .ti .tt .allday { font-size: 11px; color: var(--text-2); background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
  .ti.due .tt .allday { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .ti .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
  .ti .tx { min-width: 0; }
  .ti .tx b { display: block; font-size: 15px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ti .tx small { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ti.past { opacity: .45; }
  .ti.now { background: color-mix(in srgb, var(--c) 12%, transparent); }
  .badge-now, .badge-next { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--c); }
  .badge-next { background: var(--surface-2); color: var(--text-2); }
  .td-empty { text-align: center; color: var(--text-2); padding: 26px 0; font-size: 14px; }
  .cal-head .icon { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-2); padding: 4px 0; }
  .cd { border: 0; background: transparent; border-radius: 12px; padding: 6px 0 5px; cursor: pointer; display: grid; justify-items: center; gap: 3px; font: inherit; color: var(--text); min-height: 46px; }
  .cd:hover { background: var(--surface-2); }
  .cd .n { font-size: 14px; font-weight: 600; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
  .cd.sun .n { color: #e5484d; } .cd.sat .n { color: #3b6cf6; }
  .cd.out { opacity: .35; }
  .cd.today .n { background: linear-gradient(135deg, #3b6cf6, #8b5cf6); color: #fff; font-weight: 800; }
  .cd.sel { background: var(--accent-soft); }
  .cd .dots { display: flex; gap: 2px; height: 6px; }
  .cd .dots i, .legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--text-2); }
  /* 넓은 화면: 설명이 보이는 카드형 */
  @media (min-width: 720px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .tile { flex-direction: row; align-items: center; text-align: left; gap: 14px; padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; }
    .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--c1) 40%, var(--border)); }
    .tile:hover .ic { transform: rotate(-4deg) scale(1.05); }
    .tile .ic { width: 58px; height: 58px; flex: none; border-radius: 17px; }
    .tile .ic svg, .tile .ic::after { border-radius: 17px; }
    .tile b { font-size: 16px; }
    .tile p { display: block; }
  }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); } .tile { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { .tile.pop { animation: none; } .tile .ic, .tile { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6cf6"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
      <rect width="64" height="64" rx="18" fill="url(#lg)"/>
      <path d="M14 30L32 17l18 13v17a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="#fff"/>
      <rect x="20" y="34" width="9" height="7" rx="1.5" fill="#8b5cf6" opacity=".55"/><rect x="35" y="34" width="9" height="7" rx="1.5" fill="#8b5cf6" opacity=".55"/>
      <rect x="28" y="42" width="8" height="8" rx="1.5" fill="#3b6cf6"/>
      <circle cx="47" cy="17" r="6" fill="#fde047"/>
    </svg>
    <div class="brand">온라인 교무실<small id="school">우리 학교 선생님들의 일터</small></div>
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
  </header>

  <section class="hello">
    <h2 id="greet">안녕하세요, <span class="grad">선생님</span></h2>
    <p id="sub">오늘 필요한 일을 골라 바로 시작하세요.</p>
    <div class="userbar hidden" id="userbar"><span class="who" id="who"></span><button class="btn small ghost" id="meBtn" type="button">내 정보</button><button class="btn small ghost" id="logout" type="button">로그아웃</button></div>
  </section>

  <section class="card auth hidden" id="auth"></section>
  <div id="appArea">
  <section class="today hidden" id="today">
    <div class="card tl"><div class="td-head" id="tdHead"></div><div class="pends" id="tdPend"></div><div class="tlist" id="tdList"></div></div>
    <div class="card cal"><div class="cal-head" id="calHead"></div><div class="cal-grid" id="calGrid"></div><div class="legend" id="calLegend"></div></div>
  </section>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="무엇을 할까요? 예: 교체, 동의서" aria-label="앱 찾기" autocomplete="off">
  </label>

  <section class="sec hidden" id="recentSec"><h3>최근 사용</h3><div class="recent" id="recent"></div></section>
  <div id="sections"></div>
  </div>
  <footer>13개 앱 · 이미지 없이 코드로 그린 아이콘 · <a href="https://github.com/t-gsh019-crypto/online-gyomusil" style="color:inherit">소스 보기</a></footer>
</main>

<dialog id="meDialog"><form method="dialog" id="meForm">
  <h2>내 정보</h2>
  <label for="mName">이름</label><input id="mName" required maxlength="20">
  <label for="mGroup">소속</label><select id="mGroup"></select>
  <p class="muted" style="font-size:12px;margin:6px 0 0">이름을 바꿔도 예전에 쓴 글의 작성자 이름은 그대로 남아요.</p>
  <div id="pwBox">
    <h3 style="margin:18px 0 0;font-size:16px">🔑 비밀번호 바꾸기 <small class="muted" style="font-size:12px;font-weight:600">(바꿀 때만 적어 주세요)</small></h3>
    <label for="mPw">새 비밀번호</label><input id="mPw" type="password" minlength="8" autocomplete="new-password" placeholder="8자 이상">
    <label for="mPw2">새 비밀번호 확인</label><input id="mPw2" type="password" autocomplete="new-password">
  </div>
  <p class="muted" id="mEmail" style="font-size:13px"></p>
  <p id="mMsg" style="font-size:13px;color:var(--danger);margin:4px 0 0"></p>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>취소</button><button class="btn" value="ok">저장</button></div>
</form></dialog>

<script>window.GYOMUSIL_PAGE = "home";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="shared/config.js"></script>
<script src="shared/store.js"></script>
<script src="shared/school.js"></script>
<script src="shared/apps.js"></script>
<script src="shared/today.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const GROUPS = [
  { title: "소통", ids: ["notice", "messenger", "survey", "family"] },
  { title: "업무·자료", ids: ["tasks", "minutes", "files", "links"] },
  { title: "일정·수업", ids: ["calendar", "timetable", "booking", "lessons", "assess"] },
];
// 검색이 잘 되도록 앱마다 떠올릴 만한 말을 덧붙임
const KEYWORDS = {
  notice: "공지 전달 읽음 댓글 알림", calendar: "일정 행사 학사 달력 캘린더", timetable: "시간표 교체 보강 결강 출장",
  files: "자료 양식 파일 공문 서식", survey: "설문 조사 회신 참석 신청", booking: "예약 특별실 과학실 태블릿 기자재",
  tasks: "업무 할일 체크 마감 제출", messenger: "메신저 대화 채팅 쪽지", minutes: "회의 협의록 회의록 기록 서명",
  links: "링크 나이스 에듀파인 바로가기 사이트", lessons: "수업 지도안 자료 차시 학습지", assess: "평가 수행평가 루브릭 채점 기준",
  family: "학부모 가정통신문 알림장 동의서 회신 학생",
};

const read = (k, d) => { try { return JSON.parse(localStorage.getItem("gyomusil:" + k)) ?? d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem("gyomusil:" + k, JSON.stringify(v)); } catch {} };

/* 시계와 인사 */
function tick() {
  const d = new Date(), h = d.getHours();
  $("time").textContent = `${String(h).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  $("date").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
  const me = Me.get();
  const hi = h < 5 ? "늦은 시간까지 수고 많으세요" : h < 11 ? "좋은 아침이에요" : h < 14 ? "점심 맛있게 드세요" : h < 18 ? "오후도 힘내세요" : "오늘도 수고 많으셨어요";
  $("greet").innerHTML = `${hi},<br><span class="grad">${me ? esc(me.name) + " 선생님" : "선생님"}</span>`;
  const weekend = d.getDay() === 0 || d.getDay() === 6;
  $("sub").innerHTML = me ? `${esc(me.group)} · ${weekend ? "주말엔 푹 쉬세요. 급한 일만 살짝 확인해요." : "오늘 필요한 일을 골라 바로 시작하세요."}`
    : Auth.on ? "이메일로 로그인하면 13개 앱을 바로 쓸 수 있어요." : "처음이시면 앱을 열 때 이름과 소속을 한 번만 적어 주세요.";
}
tick(); setInterval(tick, 15000);

/* 아이콘 화면 */
function tile(a, i) {
  return `<a class="tile pop" href="./${a.id}/" data-id="${a.id}" style="--c1:${a.c1};animation-delay:${i * 35}ms" aria-label="${esc(a.name)}: ${esc(a.desc)}">
    <span class="ic">${appIcon(a.id)}</span><span><b>${esc(a.name)}</b><p>${esc(a.desc)}</p></span></a>`;
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const match = (a) => !q || (a.name + a.desc + KEYWORDS[a.id]).toLowerCase().includes(q);
  let n = 0;
  if (q) {
    const hits = APPS.filter(match);
    $("sections").innerHTML = hits.length ? `<section class="sec"><h3>찾은 앱 ${hits.length}개</h3><div class="grid">${hits.map((a) => tile(a, n++)).join("")}</div></section>`
      : `<p class="none">"${esc(q)}"에 맞는 앱이 없어요.</p>`;
  } else {
    $("sections").innerHTML = GROUPS.map((g) => `<section class="sec"><h3>${g.title}</h3><div class="grid">${g.ids.map((id) => tile(APPS.find((a) => a.id === id), n++)).join("")}</div></section>`).join("");
  }
  const recent = read("recent", []).map((id) => APPS.find((a) => a.id === id)).filter(Boolean).slice(0, 5);
  $("recentSec").classList.toggle("hidden", !recent.length || !!q);
  $("recent").innerHTML = recent.map((a) => `<a class="chipapp" href="./${a.id}/" data-id="${a.id}">${appIcon(a.id)}${esc(a.name)}</a>`).join("");
}
$("q").addEventListener("input", render);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { const first = document.querySelector("#sections .tile"); if (first) { remember(first.dataset.id); location.href = first.href; } } });
function remember(id) { write("recent", [id, ...read("recent", []).filter((x) => x !== id)].slice(0, 8)); }
document.addEventListener("click", (e) => { const t = e.target.closest("[data-id]"); if (t) remember(t.dataset.id); });
window.addEventListener("pageshow", render);
document.querySelector('link[rel="icon"]') || document.head.insertAdjacentHTML("beforeend", `<link rel="icon" href="data:image/svg+xml,${encodeURIComponent(document.querySelector(".logo").outerHTML.replace('class="logo"', 'xmlns="http://www.w3.org/2000/svg"'))}">`);
render();

/* ───────── 로그인 · 가입 · 로그아웃 ───────── */
const DEPTS = SCHOOL.depts.map((d) => d.name);
const params = new URLSearchParams(location.search);
const next = params.get("next");
let mode = "login", lastEmail = "";
const ERR = {
  "Invalid login credentials": "메일 주소나 비밀번호가 맞지 않아요.",
  "Email not confirmed": "아직 메일 인증을 하지 않으셨어요. 인증을 마쳐야 사용할 수 있어요.",
  "User already registered": "이미 가입된 메일이에요. 로그인해 주세요.",
  already: "이미 가입된 메일이에요. 로그인해 주세요.",
  "Password should be at least 6 characters.": "비밀번호는 8자 이상으로 정해 주세요.",
};
const errText = (e) => ERR[e.message] || (/rate limit|security purposes/i.test(e.message) ? "메일을 너무 자주 보냈어요. 잠시 뒤 다시 시도해 주세요." : /invalid.*email|email.*invalid/i.test(e.message) ? "메일 주소를 다시 확인해 주세요." : e.message);

function paintAuth(msg, kind = "err") {
  const box = $("auth");
  const m = msg ? `<p class="msg ${kind}">${msg}</p>` : "";
  const rule = `<div class="rule"><span>🔐</span><span><b>메일 인증을 마쳐야 사용할 수 있어요.</b> 가입하면 인증 메일이 가요. 메일 속 링크를 누르기 전에는 로그인되지 않아요. 메일이 안 보이면 스팸함도 확인해 주세요.</span></div>`;
  if (mode === "login" || mode === "signup") {
    box.innerHTML = `<h3>${mode === "login" ? "로그인" : "선생님 가입"}</h3><p class="lead">우리 학교 선생님만 쓰는 온라인 교무실이에요.</p>
      <div class="seg"><button type="button" data-m="login" class="${mode === "login" ? "on" : ""}">로그인</button><button type="button" data-m="signup" class="${mode === "signup" ? "on" : ""}">가입</button></div>
      <form id="aForm">
        ${mode === "signup" ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="aName">이름</label><input id="aName" required maxlength="20" placeholder="예: 김민지"></div>
          <div><label for="aGroup">소속</label><select id="aGroup">${DEPTS.map((d) => `<option>${esc(d)}</option>`).join("")}</select></div></div>` : ""}
        <label for="aEmail">메일 주소</label><input id="aEmail" type="email" required autocomplete="email" value="${esc(lastEmail)}" placeholder="name@example.com">
        <label for="aPw">비밀번호</label><input id="aPw" type="password" required minlength="${mode === "signup" ? 8 : 1}" autocomplete="${mode === "signup" ? "new-password" : "current-password"}" placeholder="${mode === "signup" ? "8자 이상" : ""}">
        ${mode === "signup" ? `<label for="aPw2">비밀번호 확인</label><input id="aPw2" type="password" required autocomplete="new-password">` : ""}
        <button class="btn full" id="aGo" type="submit">${mode === "login" ? "로그인" : "가입하고 인증 메일 받기"}</button>
      </form>
      ${m}${mode === "login" ? `<p class="msg"><button class="link" type="button" data-m="reset">비밀번호를 잊으셨나요?</button>${/인증/.test(msg || "") ? ` · <button class="link" type="button" id="resend">인증 메일 다시 보내기</button>` : ""}</p>` : ""}
      ${rule}`;
  } else if (mode === "sent") {
    box.innerHTML = `<div class="mail"><div class="big">📩</div><h3>인증 메일을 보냈어요</h3><p class="lead"><b>${esc(lastEmail)}</b>(으)로 보낸 메일에서<br>인증 링크(<b>Confirm your mail</b>)를 눌러 주세요.</p></div>
      ${rule}${m}<p class="msg" style="text-align:center"><button class="link" type="button" id="resend">메일 다시 보내기</button> · <button class="link" type="button" data-m="login">로그인 화면으로</button></p>`;
  } else if (mode === "reset") {
    box.innerHTML = `<h3>비밀번호 찾기</h3><p class="lead">가입한 메일로 비밀번호를 새로 정하는 링크를 보내 드려요.</p>
      <form id="aForm"><label for="aEmail">메일 주소</label><input id="aEmail" type="email" required value="${esc(lastEmail)}"><button class="btn full" type="submit">재설정 메일 보내기</button></form>
      ${m}<p class="msg"><button class="link" type="button" data-m="login">로그인 화면으로</button></p>`;
  } else if (mode === "newpw") {
    box.innerHTML = `<h3>새 비밀번호 정하기</h3><p class="lead">앞으로 쓸 비밀번호를 적어 주세요.</p>
      <form id="aForm"><label for="aPw">새 비밀번호</label><input id="aPw" type="password" required minlength="8" autocomplete="new-password" placeholder="8자 이상">
      <label for="aPw2">비밀번호 확인</label><input id="aPw2" type="password" required autocomplete="new-password"><button class="btn full" type="submit">저장</button></form>${m}`;
  }
}
$("auth").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-m]");
  if (b) { lastEmail = $("aEmail")?.value || lastEmail; mode = b.dataset.m; return paintAuth(); }
  if (e.target.id === "resend") {
    try { await Auth.resend(lastEmail || $("aEmail").value.trim()); paintAuth("인증 메일을 다시 보냈어요.", "ok"); } catch (err) { paintAuth(errText(err)); }
  }
});
$("auth").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = e.target.querySelector("button[type=submit]"); go.disabled = true;
  const email = $("aEmail")?.value.trim(), pw = $("aPw")?.value;
  if (email) lastEmail = email;
  try {
    if (mode === "login") { await Auth.signIn(email, pw); return; }
    if ((mode === "signup" || mode === "newpw") && pw !== $("aPw2").value) { go.disabled = false; return paintAuth("비밀번호 확인이 서로 달라요."); }
    if (mode === "signup") { const d = await Auth.signUp(email, pw, $("aName").value.trim(), $("aGroup").value); if (!d.session) { mode = "sent"; paintAuth(); } return; }
    if (mode === "reset") { await Auth.resetMail(email); return paintAuth("메일을 보냈어요. 메일 속 링크를 누르면 새 비밀번호를 정할 수 있어요.", "ok"); }
    if (mode === "newpw") { await Auth.newPassword(pw); mode = "login"; history.replaceState(null, "", location.pathname); return showSignedIn("비밀번호를 바꿨어요"); }
  } catch (err) { paintAuth(errText(err)); }
  finally { if (go.isConnected) go.disabled = false; }
});

function showSignedOut() {
  $("auth").classList.remove("hidden"); $("appArea").classList.add("hidden"); $("userbar").classList.add("hidden");
  paintAuth(next ? "로그인한 선생님만 쓸 수 있어요. 먼저 로그인해 주세요." : "", "ok");
  tick();
}
function showSignedIn(toast) {
  if (next && APPS.some((a) => a.id === next)) { location.replace(`./${next}/`); return; }
  $("auth").classList.add("hidden"); $("appArea").classList.remove("hidden"); $("userbar").classList.remove("hidden");
  const me = Me.get() || { name: "선생님", group: "" };
  $("who").innerHTML = `<i>${esc(me.name.slice(-2))}</i>${esc(me.name)} <small>${esc(me.group)}</small>`;
  tick(); render();
  if (!window._todayOn) { window._todayOn = true; Today.init($("today"), me); } else Today.setMe(me);
  if (toast) flash(toast);
  // 선생님 명단에 등록 (메신저·미응답 확인에 씀)
  Store.list("teachers").then((list) => { if (!list.some((t) => t.name === me.name)) Store.insert("teachers", { name: me.name, group: me.group }); }).catch(() => {});
}
function flash(t) {
  const d = document.createElement("div");
  d.textContent = t;
  d.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg)";
  document.body.append(d); setTimeout(() => d.remove(), 2600);
}
$("logout").onclick = async () => { await Auth.signOut(); };
$("meBtn").onclick = () => {
  const me = Me.get() || {};
  $("mGroup").innerHTML = DEPTS.map((d) => `<option ${d === me.group ? "selected" : ""}>${esc(d)}</option>`).join("");
  $("mPw").value = $("mPw2").value = ""; $("mMsg").textContent = ""; $("pwBox").classList.toggle("hidden", !Auth.on);
  $("mName").value = me.name || ""; $("mEmail").textContent = Auth.user()?.email ? `로그인 메일: ${Auth.user().email}` : "";
  $("meDialog").showModal();
};
$("meForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  e.preventDefault();
  const pw = $("mPw").value, me = { name: $("mName").value.trim(), group: $("mGroup").value };
  if (pw && pw !== $("mPw2").value) return ($("mMsg").textContent = "새 비밀번호 확인이 서로 달라요.");
  try {
    if (Auth.on) { await Auth.update(me); if (pw) await Auth.newPassword(pw); } else Me.set(me);
    $("meDialog").close();
    flash(pw ? "내 정보와 비밀번호를 바꿨어요" : "내 정보를 바꿨어요");
    if (!Auth.on) showSignedIn();
  } catch (err) { $("mMsg").textContent = /different from the old/i.test(err.message) ? "지금과 다른 비밀번호를 적어 주세요." : err.message; }
});

if (!Auth.on) {
  $("userbar").classList.remove("hidden"); $("logout").classList.add("hidden");
  if (Me.get()) showSignedIn();
}
if (Auth.on) {
  // 메일 링크가 만료됐거나 잘못됐을 때 주소에 오류가 붙어서 돌아옴
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error")) { mode = "login"; history.replaceState(null, "", location.pathname); }
  $("appArea").classList.add("hidden");
  Auth.client.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") { mode = "newpw"; $("auth").classList.remove("hidden"); $("appArea").classList.add("hidden"); return paintAuth(); }
      if (mode === "newpw") return;
      if (event === "USER_UPDATED" && session) return showSignedIn();
      if (session) {
        const fromMail = /type=signup|access_token/.test(location.hash);
        if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        showSignedIn(fromMail ? "메일 인증을 마쳤어요. 환영해요!" : "");
      } else {
        showSignedOut();
        if (hash.get("error")) paintAuth("인증 링크가 만료됐거나 이미 쓰였어요. 로그인해 보시고, 안 되면 인증 메일을 다시 받아 주세요.");
      }
    });
  });
}
</script>
</body>
</html>
