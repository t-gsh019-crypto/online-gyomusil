# 학교망에서 날씨 서비스가 막혀도 보이도록, 30분마다 기상청(없으면 Open-Meteo) 날씨를 받아 사이트(main)에 weather.json으로 올려 둠
name: weather
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths-ignore: [weather.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 날씨 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: |
          python3 .github/scripts/weather.py
      - name: 올리기
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet && exit 0
          git commit -m "날씨 갱신"
          git pull -q --rebase origin main
          git push origin HEAD:main
      - name: 사이트 다시 만들기
        # 봇이 올린 변경은 사이트가 저절로 다시 만들어지지 않아서 직접 요청함
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "다시 만들기 요청 실패"
