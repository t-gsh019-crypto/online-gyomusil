# Supabase 무료 요금제는 7일 동안 사용이 적으면 멈춤 → 하루 두 번 데이터베이스에 가볍게 접속해서 깨워 둠
name: supabase-keepalive
on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 접속
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' shared/config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' shared/config.js | head -1)
          for t in family_notices teachers notices; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$URL/rest/v1/$t?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$t: $code"
          done
