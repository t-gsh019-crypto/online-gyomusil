<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지·업무 전달</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b6cf6'/%3E%3Cpath d='M16 28h8l18-10v28L24 36h-8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/common.css">
<style>
  :root { --accent: #3b6cf6; --accent-2: #8b5cf6; }
  .toolbar { display: flex; gap: 8px; margin: 18px 0 6px; }
  .search { position: relative; flex: 1; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-2); }
  .search input { padding-left: 42px; }
  .toolbar select { width: auto; }
  .list { display: grid; gap: 12px; }
  .notice { cursor: pointer; display: grid; gap: 10px; position: relative; overflow: hidden; }
  .notice.pinned { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 60%); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
  .notice.pinned::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--grad); }
  .notice h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; display: flex; gap: 8px; align-items: center; }
  .notice .preview { color: var(--text-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 18%, transparent); }
  .pin { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #fff; background: var(--grad); padding: 3px 8px; border-radius: 999px; }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .reads { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
  .detail-body { white-space: pre-wrap; margin: 16px 0; font-size: 16px; }
  .attach { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; text-decoration: none; }
  .readers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .read-box { margin-top: 16px; border-radius: 16px; background: var(--surface-2); overflow: hidden; }
  .read-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 14px 16px; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
  .read-toggle:hover { background: var(--accent-soft); }
  .read-toggle .caret { margin-left: auto; transition: transform .25s var(--ease); color: var(--text-2); }
  .read-box.open .caret { transform: rotate(180deg); }
  .read-list { display: none; padding: 0 16px 14px; }
  .read-box.open .read-list { display: grid; gap: 6px; animation: rise .3s var(--ease); }
  .reader { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .reader .when { margin-left: auto; color: var(--text-2); font-size: 12px; }
  .edited { font-size: 12px; color: var(--text-2); }
  .comments { margin-top: 18px; }
  .comments h4 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .comment { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .comment .head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .comment .head b { color: var(--text); }
  .comment .text { white-space: pre-wrap; font-size: 15px; margin-top: 2px; }
  .comment .tools { margin-left: auto; display: flex; gap: 2px; }
  .link-btn { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .link-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .link-btn.del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .comment textarea, .c-new textarea { min-height: 64px; }
  .c-new { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .c-new textarea { flex: 1; min-height: 46px; height: 46px; }
  .meta .cmt { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; margin-right: 8px; }
  .meta .cmt svg, .reads svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <svg class="app-icon" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6cf6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#ig)"/>
      <path d="M14 27h9l19-11v32L23 37h-9a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" fill="#fff"/>
      <path d="M20 37l4 11h6l-3-11" fill="#cfe0ff"/>
      <path d="M47 25c3 2 3 12 0 14M51 21c6 4 6 18 0 22" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>공지·업무 전달</h1>
    <button class="me-chip" id="meChip" type="button">내 정보</button>
    <a class="home-link" href="../">← 메인</a>
  </div>
</header>

<main class="wrap">
  <div class="banner hidden" id="modeBanner">⚠️ 체험 모드예요. 지금은 이 기기에만 저장돼요.</div>

  <section class="hero">
    <span class="eyebrow">📢 NOTICE BOARD</span>
    <h2>오늘의 <span class="grad">공지·업무 전달</span></h2>
    <p>학년·부서별로 전하고, 누가 읽었는지 바로 확인해요.</p>
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>전체 공지</span></div>
      <div class="stat"><b id="sUnread">0</b><span>안 읽은 공지</span></div>
      <div class="stat"><b id="sToday">0</b><span>오늘 올라온 글</span></div>
    </div>
  </section>

  <div class="toolbar">
    <label class="search" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="제목·내용 검색" aria-label="검색"></label>
    <select id="readFilter" aria-label="읽음 필터">
      <option value="all">전체 글</option>
      <option value="unread">안 읽은 글만</option>
      <option value="mine">내가 쓴 글</option>
    </select>
  </div>
  <nav class="pills" id="tabs" aria-label="대상"></nav>
  <section class="list" id="list"></section>
</main>

<button class="btn fab" id="writeBtn" type="button">＋ 공지 쓰기</button>

<!-- 내 정보 -->
<dialog id="meDialog">
  <form method="dialog" id="meForm">
    <h2>선생님 정보</h2>
    <p class="muted">누가 쓰고 읽었는지 표시하는 데 써요.</p>
    <label for="meName">이름</label>
    <input id="meName" required maxlength="20" placeholder="예: 김민지">
    <label for="meGroup">소속</label>
    <select id="meGroup"></select>
    <div class="actions"><button class="btn" value="ok">저장</button></div>
  </form>
</dialog>

<!-- 공지 쓰기 -->
<dialog id="writeDialog">
  <form method="dialog" id="writeForm">
    <h2 id="wHead">공지 쓰기</h2>
    <label for="wTitle">제목</label>
    <input id="wTitle" required maxlength="80">
    <label for="wTarget">받는 대상</label>
    <select id="wTarget"></select>
    <label for="wBody">내용</label>
    <textarea id="wBody" required></textarea>
    <label for="wLink">첨부 링크 (구글 드라이브 등, 선택)</label>
    <input id="wLink" type="url" placeholder="https://">
    <label class="check"><input type="checkbox" id="wPinned"> 중요 공지로 맨 위에 고정</label>
    <div class="actions">
      <button class="btn ghost" value="cancel" formnovalidate>취소</button>
      <button class="btn" value="ok" id="wSubmit">올리기</button>
    </div>
  </form>
</dialog>

<!-- 공지 보기 -->
<dialog id="viewDialog">
  <h2 id="vTitle"></h2>
  <div class="row muted" id="vMeta"></div>
  <div class="detail-body" id="vBody"></div>
  <div id="vLink"></div>
  <div class="read-box" id="readBox">
    <button class="read-toggle" id="readToggle" type="button" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="vReadCount"></span>
      <svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="read-list" id="vReaders"></div>
  </div>
  <section class="comments">
    <h4>💬 댓글 <span id="vCmtCount">0</span></h4>
    <div id="vComments"></div>
    <form class="c-new" id="cForm">
      <textarea id="cBody" placeholder="댓글을 남겨 주세요" required maxlength="500" aria-label="댓글"></textarea>
      <button class="btn small" type="submit">등록</button>
    </form>
  </section>
  <div class="actions">
    <button class="btn ghost hidden" id="vEdit" type="button">수정</button>
    <button class="btn ghost hidden" id="vPin" type="button"></button>
    <button class="btn danger hidden" id="vDelete" type="button">삭제</button>
    <button class="btn" id="vClose" type="button">닫기</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/school.js"></script>
<script>
const GROUPS = ["전체", ...SCHOOL.depts.map((d) => d.name)];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

let notices = [], reads = [], comments = [], tab = "전체", me = Me.get(), openId = null, editingId = null, editingComment = null;

if (Store.mode === "local") $("modeBanner").classList.remove("hidden");
$("meGroup").innerHTML = GROUPS.slice(1).map((g) => `<option>${g}</option>`).join("");
$("wTarget").innerHTML = GROUPS.map((g) => `<option>${g}</option>`).join("");
$("tabs").innerHTML = GROUPS.map((g) => `<button type="button" data-g="${g}">${g}</button>`).join("");

function askMe() {
  $("meName").value = me?.name || "";
  $("meGroup").value = GROUPS.includes(me?.group) ? me.group : GROUPS[1];
  $("meDialog").showModal();
}
$("meForm").addEventListener("submit", () => {
  me = { name: $("meName").value.trim(), group: $("meGroup").value };
  Me.set(me);
  paintMe();
  render();
});
$("meChip").onclick = askMe;
function paintMe() { $("meChip").textContent = me ? `👤 ${me.name}` : "내 정보"; $("meChip").title = me ? `${me.name} · ${me.group} (눌러서 바꾸기)` : ""; }

const readersOf = (id) => reads.filter((r) => r.notice_id === id);
const iRead = (id) => me && readersOf(id).some((r) => r.reader === me.name);
const commentsOf = (id) => comments.filter((c) => c.notice_id === id).sort((a, b) => a.created_at.localeCompare(b.created_at));

async function load() {
  try {
    [notices, reads, comments] = await Promise.all([
      Store.list("notices"), Store.list("notice_reads"), Store.list("notice_comments").catch(() => []),
    ]);
  } catch (e) {
    $("list").innerHTML = `<div class="card">불러오지 못했어요: ${esc(e.message)}</div>`;
    return;
  }
  render();
  if (openId) paintView(openId);
}

function render() {
  [...$("tabs").children].forEach((b) => b.classList.toggle("on", b.dataset.g === tab));
  const todayKey = new Date().toDateString();
  $("sAll").textContent = notices.length;
  $("sUnread").textContent = notices.filter((n) => !iRead(n.id)).length;
  $("sToday").textContent = notices.filter((n) => new Date(n.created_at).toDateString() === todayKey).length;
  const q = $("search").value.trim().toLowerCase();
  const f = $("readFilter").value;
  const rows = notices
    .filter((n) => tab === "전체" || n.target === tab || n.target === "전체")
    .filter((n) => !q || (n.title + " " + n.body).toLowerCase().includes(q))
    .filter((n) => f === "all" || (f === "unread" ? !iRead(n.id) : n.author === me?.name))
    .sort((a, b) => (b.pinned - a.pinned) || b.created_at.localeCompare(a.created_at));

  if (!rows.length) {
    $("list").innerHTML = `<div class="empty">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
        <circle cx="60" cy="60" r="52" fill="var(--accent-soft)"/>
        <path d="M30 54h12l30-17v46L42 66H30a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4z" fill="url(#eg)"/>
        <path d="M40 66l6 17h9l-5-17" fill="url(#eg)" opacity=".6"/>
        <path d="M80 50c5 4 5 16 0 20M87 43c9 7 9 27 0 34" stroke="url(#eg)" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <b>아직 공지가 없어요</b>오른쪽 아래 버튼으로 첫 공지를 올려보세요.</div>`;
    return;
  }
  $("list").innerHTML = rows.map((n, i) => {
    const cnt = readersOf(n.id).length;
    return `<article class="card lift notice rise ${n.pinned ? "pinned" : ""}" style="animation-delay:${Math.min(i, 8) * 40}ms" data-id="${n.id}">
      <h3>${!iRead(n.id) ? '<span class="dot" title="안 읽음"></span>' : ""}${n.pinned ? '<span class="pin">📌 중요</span>' : ""}${esc(n.title)}</h3>
      <div class="preview">${esc(n.body)}</div>
      <div class="meta">
        <span class="avatar">${esc(n.author.slice(-2))}</span>
        <span><b style="color:var(--text)">${esc(n.author)}</b> · ${fmt(n.created_at)}</span>
        <span class="chip accent">${esc(n.target)}</span>
        <span class="reads"><span class="cmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>${commentsOf(n.id).length}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>${cnt}</span>
      </div></article>`;
  }).join("");
}

$("tabs").onclick = (e) => { if (e.target.dataset.g) { tab = e.target.dataset.g; render(); } };
$("search").oninput = render;
$("readFilter").onchange = render;
$("list").onclick = (e) => { const c = e.target.closest(".notice"); if (c) openView(c.dataset.id); };

$("writeBtn").onclick = () => {
  if (!me) return askMe();
  editingId = null;
  $("writeForm").reset();
  $("wHead").textContent = "공지 쓰기";
  $("wSubmit").textContent = "올리기";
  $("wTarget").value = "전체";
  $("writeDialog").showModal();
};
function openEdit(n) {
  editingId = n.id;
  $("wHead").textContent = "공지 수정";
  $("wSubmit").textContent = "수정 완료";
  $("wTitle").value = n.title;
  $("wTarget").value = n.target;
  $("wBody").value = n.body;
  $("wLink").value = n.link || "";
  $("wPinned").checked = n.pinned;
  $("writeDialog").showModal();
}
$("writeForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  const row = {
    title: $("wTitle").value.trim(),
    body: $("wBody").value.trim(),
    target: $("wTarget").value,
    link: $("wLink").value.trim() || null,
    pinned: $("wPinned").checked,
  };
  if (editingId) await Store.update("notices", editingId, { ...row, updated_at: new Date().toISOString() });
  else await Store.insert("notices", { ...row, author: me.name, author_group: me.group });
  editingId = null;
  load();
});

async function openView(id) {
  openId = id;
  editingComment = null;
  $("readBox").classList.remove("open");
  $("readToggle").setAttribute("aria-expanded", "false");
  $("cBody").value = "";
  paintView(id);
  $("viewDialog").showModal();
  if (me && !iRead(id)) {
    await Store.insert("notice_reads", { notice_id: id, reader: me.name, reader_group: me.group });
    load();
  }
}
function paintView(id) {
  const n = notices.find((x) => x.id === id);
  if (!n) return;
  const rs = readersOf(id);
  $("vTitle").textContent = (n.pinned ? "📌 " : "") + n.title;
  $("vMeta").innerHTML = `<span class="avatar">${esc(n.author.slice(-2))}</span><span class="chip accent">${esc(n.target)}</span><span>${esc(n.author)} (${esc(n.author_group)})</span><span>·</span><span>${fmt(n.created_at)}</span>`;
  $("vBody").textContent = n.body;
  $("vLink").innerHTML = n.link && /^https?:\/\//.test(n.link) ? `<a class="attach" href="${esc(n.link)}" target="_blank" rel="noopener">📎 첨부 열기</a>` : "";
  $("vReadCount").textContent = `읽은 선생님 ${rs.length}명`;
  $("vReaders").innerHTML = rs.sort((a, b) => a.created_at.localeCompare(b.created_at)).map((r) => `<div class="reader">
      <span class="avatar">${esc(r.reader.slice(-2))}</span><b>${esc(r.reader)}</b>
      <span class="chip">${esc(r.reader_group || "")}</span><span class="when">${fmt(r.created_at)} 읽음</span></div>`).join("") || '<span class="muted">아직 읽은 선생님이 없어요</span>';
  if (n.updated_at) $("vMeta").insertAdjacentHTML("beforeend", `<span class="edited">· ${fmt(n.updated_at)} 수정됨</span>`);
  paintComments(id);
  const mine = me && n.author === me.name;
  $("vEdit").classList.toggle("hidden", !mine);
  $("vDelete").classList.toggle("hidden", !mine);
  $("vPin").classList.toggle("hidden", !mine);
  $("vPin").textContent = n.pinned ? "고정 해제" : "맨 위 고정";
}
$("readToggle").onclick = () => {
  const open = $("readBox").classList.toggle("open");
  $("readToggle").setAttribute("aria-expanded", String(open));
};
$("vEdit").onclick = () => openEdit(notices.find((x) => x.id === openId));

function paintComments(id) {
  const cs = commentsOf(id);
  $("vCmtCount").textContent = cs.length;
  $("vComments").innerHTML = cs.map((c) => {
    const mine = me && c.author === me.name;
    const body = editingComment === c.id
      ? `<textarea id="cEdit" maxlength="500">${esc(c.body)}</textarea>
         <div class="row" style="justify-content:flex-end;margin-top:6px">
           <button class="btn small ghost" type="button" data-act="cancel">취소</button>
           <button class="btn small" type="button" data-act="save" data-id="${c.id}">저장</button></div>`
      : `<div class="text">${esc(c.body)}</div>`;
    return `<div class="comment"><span class="avatar">${esc(c.author.slice(-2))}</span><div>
      <div class="head"><b>${esc(c.author)}</b><span>${fmt(c.created_at)}</span>${c.updated_at ? '<span class="edited">(수정됨)</span>' : ""}
        ${mine && editingComment !== c.id ? `<span class="tools"><button class="link-btn" type="button" data-act="edit" data-id="${c.id}">수정</button><button class="link-btn del" type="button" data-act="del" data-id="${c.id}">삭제</button></span>` : ""}
      </div>${body}</div></div>`;
  }).join("") || '<p class="muted" style="margin:0">첫 댓글을 남겨 보세요.</p>';
  if (editingComment) $("cEdit")?.focus();
}
$("vComments").onclick = async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "edit") { editingComment = b.dataset.id; return paintComments(openId); }
  if (act === "cancel") { editingComment = null; return paintComments(openId); }
  if (act === "save") {
    const text = $("cEdit").value.trim();
    if (!text) return;
    await Store.update("notice_comments", b.dataset.id, { body: text, updated_at: new Date().toISOString() });
    editingComment = null;
    return load();
  }
  if (act === "del") { await Store.remove("notice_comments", b.dataset.id); load(); }
};
$("cForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!me) return askMe();
  const text = $("cBody").value.trim();
  if (!text) return;
  $("cBody").value = "";
  await Store.insert("notice_comments", { notice_id: openId, body: text, author: me.name, author_group: me.group });
  load();
});

$("vClose").onclick = () => { openId = null; $("viewDialog").close(); };
$("viewDialog").addEventListener("close", () => { openId = null; });
$("vDelete").onclick = async () => {
  const id = openId;
  $("viewDialog").close();
  await Store.remove("notices", id);
  load();
};
$("vPin").onclick = async () => {
  const n = notices.find((x) => x.id === openId);
  await Store.update("notices", n.id, { pinned: !n.pinned });
  load();
};

Store.subscribe("notices", load);
Store.subscribe("notice_reads", load);
Store.subscribe("notice_comments", load);
paintMe();
load();
if (!me || !GROUPS.includes(me.group)) askMe();
</script>
</body>
</html>
